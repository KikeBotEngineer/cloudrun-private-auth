name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Red de seguridad además del .gitignore: detecta la llave por contenido, no por nombre.
      - name: Sin llaves privadas en el repo
        run: |
          if git grep -nE '"private_key"[[:space:]]*:|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::Hay una llave privada versionada"; exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt -r sample-api/requirements.txt ruff pytest httpx
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
