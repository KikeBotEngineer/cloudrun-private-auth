name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Red de seguridad además del .gitignore: detecta la llave por contenido, no por nombre.
      - name: Sin llaves privadas en el repo
        run: |
          if git grep -nE '"private_key"[[:space:]]*:|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo "::error::Hay una llave privada versionada"; exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt -r sample-api/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Construye las imágenes y las arranca: detecta imports rotos o dependencias incompatibles
  # que las pruebas (fuera del contenedor) no ven.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir
        run: |
          docker build -t gateway -f gateway/Dockerfile .
          docker build -t sample-api sample-api
      - name: Arrancar y probar
        run: |
          docker run -d --name api -p 8081:8080 sample-api
          # Token estático: sin GCP. El upstream .invalid no resuelve, así se prueba el camino de error.
          docker run -d --name gw -p 8082:8080 \
            -e UPSTREAM_URL=https://upstream.invalid \
            -e "API_KEYS=ci:$(printf ci-key | sha256sum | cut -c1-64)" \
            -e "ALLOWED_ROUTES=GET /health" \
            -e GCP_ID_TOKEN=dummy \
            gateway
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for _ in $(seq 30); do
            [ "$(code localhost:8081/health)" = 200 ] && [ "$(code localhost:8082/health)" = 401 ] && break
            sleep 1
          done
          test "$(code localhost:8081/health)" = 200
          test "$(code localhost:8082/health)" = 401
          test "$(code -H 'X-API-Key: ci-key' localhost:8082/health)" = 502
      - name: Logs de los contenedores
        if: failure()
        run: docker logs api; docker logs gw
